# docker-compose.yml - Development environment
# Usage: docker compose up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.12"
    volumes:
      - ./src:/app/src:ro           # Mount source for development
    env_file:
      - .env
