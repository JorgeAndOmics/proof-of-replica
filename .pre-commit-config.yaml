repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.11.0  # Update to latest: https://github.com/astral-sh/ruff-pre-commit/releases
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.15.0  # Update to latest
    hooks:
      - id: mypy
        additional_dependencies: []  # Add typed stubs here as needed
        args: [--strict, --ignore-missing-imports]
        pass_filenames: false
        entry: uv run mypy src

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.0.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, docs, ci, chore, perf, style]
